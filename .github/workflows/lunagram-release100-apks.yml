name: Lunagram 1.0.0 release candidate APK pair

on:
  push:
    branches: ["agent/lunagram-release100"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunagram-release100-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # No forks/PRs and no production release key on this runner.
    if: github.repository == 'sergeevdeonisii-dotcom/LumaGram-Android' && github.ref == 'refs/heads/agent/lunagram-release100'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out exact source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify artifact metadata and release workflow guards
        shell: bash
        run: |
          bash -n Tools/ci/build-lunagram-release100.sh
          node --test Tools/ci/collect-lunagram-apk.test.mjs Tools/ci/release100-workflow.test.mjs
      - name: Test camera policy, edition separation, size-safe export and security
        shell: pwsh
        run: |
          ./Tools/tests/run-round-controls81-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-controls-tests')
          ./Tools/tests/run-round-editions100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-editions-tests')
          ./Tools/tests/run-round-settings100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-settings-tests')
          ./Tools/tests/run-round-limits100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-limits-tests')
          ./Tools/tests/run-round-stats82-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-stats-tests')
          ./Tools/tests/run-round-export82-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-export-tests')
          ./Tools/tests/check-release100-security.ps1
          ./Tools/tests/run-http-url100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'http-url-tests')
          ./Tools/tests/run-media-browser100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'media-browser-tests')
          ./Tools/tests/run-playback-privacy100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'playback-privacy-tests')
          ./Tools/tests/run-startup100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'startup-tests')
          ./Tools/tests/run-glass-contrast100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'glass-contrast-tests')
          ./Tools/tests/run-update-presentation100-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'update-presentation-tests')
      - name: Build personal and public APKs with a disposable signing key
        shell: bash
        env:
          LUMA_API_ID: ${{ secrets.LUMA_API_ID }}
          LUMA_API_HASH: ${{ secrets.LUMA_API_HASH }}
        run: bash Tools/ci/build-lunagram-release100.sh
      - name: Upload temporary APK pair and public provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunagram-100-temporary-signed
          path: |
            ${{ runner.temp }}/lunagram100-artifacts/*.apk
            ${{ runner.temp }}/lunagram100-artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
