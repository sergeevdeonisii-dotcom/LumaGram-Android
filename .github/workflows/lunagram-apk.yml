name: Lunagram .79 temporary APKs

on:
  push:
    branches: ["agent/lunagram79-friends-cloud"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunagram-79-apks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Never expose the owner-approved API credentials to forks or other branches.
    if: github.repository == 'sergeevdeonisii-dotcom/LumaGram-Android' && github.ref == 'refs/heads/agent/lunagram79-friends-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out exact source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified official tag
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, verified official tag
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Full and Friends with a disposable CI signing key
        shell: bash
        env:
          LUMA_API_ID: ${{ secrets.LUMA_API_ID }}
          LUMA_API_HASH: ${{ secrets.LUMA_API_HASH }}
        run: bash Tools/ci/build-lunagram-apks.sh

      - name: Upload temporary-signed APK pair and public metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official tag
        with:
          name: lunagram-79-temporary-signed
          path: |
            ${{ runner.temp }}/lunagram79-artifacts/*.apk
            ${{ runner.temp }}/lunagram79-artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
