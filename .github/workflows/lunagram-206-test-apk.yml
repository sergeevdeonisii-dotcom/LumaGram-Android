name: Lunagram 2.0.6 public test APK

on:
  push:
    branches: ["agent/lunagram-206-test"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunagram-206-test-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Test branch only. No production signing material or publication permissions.
    if: github.repository == 'sergeevdeonisii-dotcom/LumaGram-Android' && github.ref == 'refs/heads/agent/lunagram-206-test'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Check out exact source and pinned submodules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Check test-build and artifact guards without credentials
        shell: bash
        run: |
          bash -n Tools/ci/build-lunagram206.sh
          node --test Tools/ci/collect-lunagram-apk.test.mjs Tools/ci/lunagram206-workflow.test.mjs
      - name: Prepare pinned SDK without API or signing credentials
        shell: bash
        run: bash Tools/ci/build-lunagram206.sh --prepare-sdk
      - name: Run focused subscription and gesture regressions without credentials
        shell: pwsh
        run: |
          ./Tools/tests/run-feature-catalog150-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'feature-catalog206')
          ./Tools/tests/run-subscription-screen150-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'subscription-screen206')
          ./Tools/tests/run-subscription-layout204-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'subscription-layout206')
          ./Tools/tests/run-lunagram20-swipe-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'swipe206')
          ./Tools/tests/run-lunagram-media-access-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'media-access206')
          ./Tools/tests/run-round-startup-latency-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-startup206')
          ./Tools/tests/run-round-concurrent102-regressions.ps1 -JavaHome $env:JAVA_HOME -OutputRoot (Join-Path $env:RUNNER_TEMP 'round-concurrent206')
      - name: Build public test APK with a disposable signing key
        shell: bash
        env:
          LUMA_API_ID: ${{ secrets.LUMA_API_ID }}
          LUMA_API_HASH: ${{ secrets.LUMA_API_HASH }}
        run: bash Tools/ci/build-lunagram206.sh --build
      - name: Upload temporary test APK and non-secret provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lunagram-206-public-test-temporary-signed
          path: |
            ${{ runner.temp }}/lunagram206-artifacts/Lunagram-2.0.6-public-temporary.apk
            ${{ runner.temp }}/lunagram206-artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
          include-hidden-files: false
