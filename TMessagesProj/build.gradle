def isWindows = String.valueOf(DefaultNativePlatform.currentOperatingSystem.toFamilyName() == OperatingSystemFamily.WINDOWS)
def lumaProperties = new Properties()
def lumaPropertiesFile = rootProject.file('local-luma.properties')
if (!lumaPropertiesFile.exists()) {
    // Backward-compatible local path used by the original development workspace.
    lumaPropertiesFile = rootProject.file('../liquidgram/local.properties')
}
if (!lumaPropertiesFile.exists()) {
    throw new GradleException('Luma API configuration is missing')
}
lumaPropertiesFile.withInputStream { lumaProperties.load(it) }
def lumaApiId = lumaProperties.getProperty('API_ID')
def lumaApiHash = lumaProperties.getProperty('API_HASH')
if (!lumaApiId || !lumaApiHash) {
    throw new GradleException('Luma API credentials are missing')
}
android {
    compileSdkVersion 35
    buildToolsVersion '35.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        buildConfigField "int", "APP_ID", lumaApiId
        buildConfigField "String", "APP_HASH", "\"${lumaApiHash}\""

        ndk {
            abiFilters "arm64-v8a"
        }

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.10.2'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-21' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            minifyEnabled false
            shrinkResources false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), '../TMessagesProj/proguard-rules.pro', '../TMessagesProj/proguard-rules-beta.pro'
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "APP_CENTER_HASH", "\"\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
